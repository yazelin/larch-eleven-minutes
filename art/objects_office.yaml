# 國家網路管理中心十九樓（m-office）分層設計（照《香布纏．續》的分層做法：先單色塊驗證重疊，作者確認後才產圖）
#
# 單位是細格（48 遊戲 px）。人物畫面上約 3.4 細格高 ≈ 1.7 公尺 → 往上長的高度照 1 公尺 = 2 細格；
# 牆、隔間這類高的東西壓到約六成，不然地面整片被蓋住（各物件寫明取幾格）。
#   foot：佔地格 [x, y, w, h]，擋路。
#   up：往上長幾格（不佔空間）：螢幕、隔板、牆身、櫃子上半。人走進去會被蓋住。
#   side：圖框往左右多出幾格（盆栽葉子）。
#   圖框 = [x - side, y - up, w + 2*side, h + up]；排序列 = foot 最下一列。
#   gap：佔地格裡可以走的格子（門洞）。
#   column：[x, y0, n] 直的一格一段（直立的隔間牆），各自排序。
# 2026-10-09 作者：牆和門接不起來 → 照《續》嚴家，同一排的牆連門洞、電梯、門整排一張生成再切段（art/objects_gen.py LINES），
#   直的牆整條一張生成再一格一格切；流理台、冰箱移上去貼茶水間北牆；南牆延伸到茶水間；電梯改成嵌在牆裡跟牆同高。
# 原文：網管中心在十九樓，整層燈只開一半；江凌工位靠窗，桌上泡麵、三個螢幕、塑膠恐龍；
#       周主任辦公室門開一條縫，抽屜裡是管理員卡；警衛每四分鐘從電梯口走到茶水間再走回來；核心機房在二十樓，要走樓梯。

