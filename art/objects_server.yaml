# 國家網路管理中心二十樓核心機房（m-server）分層設計。欄位同 objects_office.yaml。
# 原文：核心機房在二十樓，要走樓梯。門是鐵的，刷管理員卡，開門聲很大，冷氣更大。
#       一整排機櫃閃著綠燈，最裡面有一台終端機，螢幕上只有一個游標。

map: {id: m-server, w: 32, h: 20}

ground:
  - {name: 邊界, kind: border, rects: [[0, 0, 32, 2], [0, 18, 32, 2], [0, 0, 2, 20], [30, 0, 2, 20]]}
  - {name: 高架地板, kind: raised, rects: [[2, 2, 28, 16]], desc: 灰色防靜電高架地板，一格一格方磚，有通風孔的磚透出藍光}

objects:
  # ── 北牆：精密空調與牆面 ──
  - {name: 北牆西, kind: 隔間牆, foot: [2, 3, 3, 1], up: 2, desc: 灰色水泥牆，管線}
  - {name: 空調西, kind: 雜物, foot: [5, 3, 3, 1], up: 3, desc: 精密空調機，白色，出風口吹著冷氣}
  - {name: 北牆中, kind: 隔間牆, foot: [8, 3, 16, 1], up: 2, desc: 灰色水泥牆，牆上走線槽，一排紅色警示燈}
  - {name: 空調東, kind: 雜物, foot: [24, 3, 3, 1], up: 3, desc: 精密空調機}
  - {name: 北牆東, kind: 隔間牆, foot: [27, 3, 3, 1], up: 2, desc: 灰色水泥牆}

  # ── 機櫃：兩排，每排兩段，往上 4 格（兩公尺）──
  - {name: 機櫃一西, kind: 機櫃, foot: [5, 7, 8, 1], up: 4, desc: 一整排黑色機櫃，前門網孔，綠燈一排一排閃}
  - {name: 機櫃一東, kind: 機櫃, foot: [16, 7, 8, 1], up: 4, desc: 同上}
  - {name: 機櫃二西, kind: 機櫃, foot: [5, 12, 8, 1], up: 4, desc: 同上}
  - {name: 機櫃二東, kind: 機櫃, foot: [16, 12, 8, 1], up: 4, desc: 同上，最東一櫃貼著「GFW 主控」的標籤（不放字，用紅色標牌表示）}

  # ── 最裡面：終端機 ──
  - {name: 終端機, kind: 終端機, foot: [26, 9, 3, 1], up: 2, desc: 一張鐵桌，一台黑色螢幕只有一個綠色游標，旁邊放著一頂 VR 頭盔}

  # ── 南牆：鐵門（進來的地方）。靠鏡頭這面牆只露一點，不然站在牆前的人會被蓋住 ──
  - {name: 南牆西, kind: 隔間牆, foot: [2, 17, 2, 1], up: 1, desc: 灰色水泥牆}
  - {name: 鐵門, kind: 門, foot: [4, 17, 3, 1], up: 2, desc: 厚重的灰色鐵門，門邊刷卡機亮紅燈}
  - {name: 南牆東, kind: 隔間牆, foot: [7, 17, 23, 1], up: 1, desc: 灰色水泥牆}

points:
  hero_start: [5, 15]     # 剛刷卡進門（離南牆一格，腳不被牆蓋住）
  terminal: [27, 10]      # 終端機桌前（南面）
