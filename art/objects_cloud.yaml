# 雲海裡的防火長城（m-cloud）分層設計。欄位同 objects_office.yaml。
# 原文：腳下是雲，頭頂是黑的，防火長城從左邊的地平線一直延伸到右邊的地平線，鎖鏈一節一節，每一節都有一棟樓那麼高。
#       牆腳下堆著灰色的光點，堆成一座一座的小山。江禾那一則在第三座山的半腰。牆的中段有一扇門。
#       牆外的雲是藍白色的，很亮，沒有牆。
# 長城切段，每段一個排序值；大肥魚之後整段鎖鏈崩開（牆段事件看變數 wall 消失），23:58 備援系統再扣回來。

map: {id: m-cloud, w: 56, h: 36}

ground:
  - {name: 邊界, kind: border, rects: [[0, 0, 56, 1], [0, 35, 56, 1], [0, 0, 2, 36], [54, 0, 2, 36]]}
  - {name: 牆外, kind: outside, rects: [[2, 1, 52, 8]], desc: 藍白色的雲，很亮}
  - {name: 雲海, kind: cloud, rects: [[2, 9, 52, 26]], desc: 灰藍色雲海，頭頂是黑的，霓虹青色的格線浮在雲裡}

objects:
  # ── 防火長城：一節一節的鎖鏈牆，往上 6 格；中段是門 ──
  - {name: 長城一, kind: 長城, foot: [2, 9, 8, 1], up: 6, desc: 巨大的鎖鏈，一節一節橫躺疊成牆，暗紅霓虹，每一節一棟樓高}
  - {name: 長城二, kind: 長城, foot: [10, 9, 8, 1], up: 6, desc: 同上}
  - {name: 長城三, kind: 長城, foot: [18, 9, 8, 1], up: 6, desc: 同上}
  - {name: 長城門, kind: 門, foot: [26, 9, 4, 1], up: 7, desc: 牆中段的一扇門，鐵灰色，門上一個鎖頭浮水印}
  - {name: 長城四, kind: 長城, foot: [30, 9, 8, 1], up: 6, desc: 同上}
  - {name: 長城五, kind: 長城, foot: [38, 9, 8, 1], up: 6, desc: 同上}
  - {name: 長城六, kind: 長城, foot: [46, 9, 8, 1], up: 6, desc: 同上}

  # ── 牆腳下的灰色光點山（今晚扣下來的河城）──
  - {name: 光點山一, kind: 光點山, foot: [5, 21, 6, 2], up: 2, desc: 灰色光點堆成的小山，每一顆是一則訊息}
  - {name: 光點山二, kind: 光點山, foot: [17, 25, 7, 2], up: 2, desc: 同上，大一點}
  - {name: 光點山三, kind: 光點山, foot: [38, 18, 7, 2], up: 3, desc: 同上，最大；半腰有一顆光很弱、還在閃（江禾那一則）}

  # ── 雲柱（擋路、讓人可以躲到後面）──
  - {name: 雲柱西, kind: 雲柱, foot: [12, 15, 2, 1], up: 4, desc: 雲凝成的柱子，裡面流著資料光}
  - {name: 雲柱東, kind: 雲柱, foot: [46, 27, 2, 1], up: 4, desc: 同上}

points:
  hero_start: [28, 32]    # 戴上頭盔，走進雲海
  mound3: [41, 20]        # 第三座山的半腰（山的南面）
  gate: [27, 10]          # 門前
  censor1: [30, 25]
  censor2: [22, 19]
  censor3: [35, 14]
  censor4: [16, 12]
  hound1: [44, 24]
  hound2: [9, 18]

labels:            # 區域名牌
  防火長城: [12, 10]
  牆外: [28, 4]
  光點山: [8, 23]
  光點山 : [20, 27]
